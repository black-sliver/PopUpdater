name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  RELEASE_MODE: ReleaseSmall

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5.0.0
      - uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.14.0
      - name: Install Dependencies (scoop)
        if: startsWith(matrix.os, 'windows')
        uses: MinoruSekine/setup-scoop@v4.0.2
        with:
          apps: >-
            minisign
            zip
      - name: Install Dependencies (brew)
        if: startsWith(matrix.os, 'macos')
        run: brew install minisign
      - name: Install Dependencies (apt)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt install minisign
      - name: Run Tests (Debug)
        run: zig build test --summary all
      - name: Build (Debug)
        run: zig build
      - name: Test Build (Debug)
        shell: bash
        run: ./test/test.sh
      - name: Run Tests (Release)
        run: zig build test -Doptimize="${{ env.RELEASE_MODE }}" --summary all
      - name: Build (Release)
        run: zig build -Doptimize="${{ env.RELEASE_MODE }}"
      - name: Test Build (Release)
        shell: bash
        run: ./test/test.sh
      - name: Store Release Build
        uses: actions/upload-artifact@v5.0.0
        with:
          name: PopUpdater-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          compression-level: 9
          path: |
            zig-out/bin/*
            !zig-out/bin/*.pdb
